spring.application.name=hospital-manager
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_manager}
spring.data.mongodb.database=${MONGODB_DATABASE:hospital_manager}
app.jwt.secret=${JWT_SECRET:changeThisSecretKeyInEnvironmentForLocalDevOnlyMustBeLongEnoughForHS384}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
